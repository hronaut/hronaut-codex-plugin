name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The headers helper runs under sh on Linux and macOS and through cmd.exe on Windows.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The end-to-end test installs the plugin with this Codex CLI; it skips when Codex isn't installed.
      - run: npm install --no-save @openai/codex@0.165.0
      - run: npm test
